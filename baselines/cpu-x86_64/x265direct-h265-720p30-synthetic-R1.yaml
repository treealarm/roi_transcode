# TZ v4.2 §38 baseline manifest. Generated by sve-baseline -- do not edit:
# regenerate and commit. Changing any field below changes profile_version,
# which is what §38 asks for.
profile_version: ef998f3d84e51e42
protocol: SVENC-1.0

hardware_class: cpu-x86_64
dataset: synthetic
operating_point: R1

backend: x265direct
backend_opened: libx265 (CPU, direct API, per-block quantOffsets)
codec: h265

encoder:
  library: libx265
  version: "4.1"
  preset: balanced
  rate_control: vbr
  target_bitrate: 750000
  gop_size: 60
  quality_policy: OBJECT_FIRST
  fallback_policy: permissive
  # §38's example also prints b_frames, lookahead, spatial_aq and temporal_aq.
  # They are absent because nothing can report them: each backend configures them
  # itself -- x264 forces aq on, because its quant_offsets do not work without it --
  # and no public interface asks a backend what it settled on. Pinning them needs
  # that query first; docs/STATUS.md records it under §38 rather than writing a
  # plausible value here that nobody chose.

input:
  width: 1280
  height: 720
  fps: 30
  resolution_class: 720p30
  bpppf: 0.027127
