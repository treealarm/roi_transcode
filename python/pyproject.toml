# Packaging for the Python bindings -- TZ v4.2 §58.7.
#
# scikit-build-core as the PEP 517 backend, as §58.7 names. It drives the same CMake the C++
# build uses, so the extension a wheel contains is built the way everything else here is
# rather than by a second, parallel description that can drift.
#
# The version is not written here. §58.7 requires one version source and vcpkg.json is it;
# the root CMakeLists reads that file and passes the number to both the C++ project and the
# extension, so a release touches one place.

[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "smart-video-encoder"
dynamic = ["version"]
description = "Adaptive ROI video encoding driven by external CV results"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
# The build is rooted at the repository, not at python/: the extension links the C++
# library, and configuring from here would build it twice under two sets of options.
cmake.source-dir = ".."
wheel.packages = ["smart_video_encoder"]
# Outside the package directory: a build tree under python/ ends up inside the sdist and
# inside the source directory CMake exports against.
build-dir = "../build-wheel/{wheel_tag}"

[tool.scikit-build.cmake.define]
# Manifest mode off: with it on, vcpkg installs its tree inside the wheel's build directory
# -- which sits under the source tree -- and CMake then refuses to export targets whose
# library paths are "prefixed in the source directory". The toolchain file and an already
# installed vcpkg tree come from the environment, which is where machine-specific paths
# belong.
VCPKG_MANIFEST_MODE = "OFF"
# A wheel carries the Python package and its extension. The C++ headers and static
# archives are not usable from Python and were adding about 1.5 MB of nothing.
SVE_INSTALL = "OFF"
SVE_BUILD_PYTHON = "ON"
SVE_BUILD_TESTS = "OFF"
SVE_BUILD_INTEGRATION = "OFF"
SVE_BUILD_TOOLS = "OFF"
# §5.5's dependency graph, and the only one a shared object can be built from where FFmpeg
# is a static library without -fPIC. It is also exactly what §58.9 tests against.
SVE_BUILD_BACKEND_FFMPEG = "OFF"
SVE_BUILD_EXAMPLES = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../vcpkg.json"
regex = '"version"\s*:\s*"(?P<value>[^"]+)"'
